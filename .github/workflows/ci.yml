name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    # 单一安装来源：所有 CI 步骤的工具都来自 pyproject extras
    # （原 CI 调用未安装的 black/flake8/mypy/sphinx，exit 127）
    - name: Install dependencies
      run: |
        pip install -e ".[dev]"

    - name: Lint (ruff)
      run: ruff check agent_os_kernel/ tests/ scripts/

    - name: Format check (black)
      run: black --check agent_os_kernel/ tests/ scripts/

    - name: Type check (mypy, ratchet)
      run: mypy agent_os_kernel/ || true

    - name: Test
      # -p no:randomly: CI 用确定性顺序，失败可复现可定位
      run: pytest tests/ -q --cov=agent_os_kernel --cov-report=xml -p no:randomly

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml

  golden-path:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install
      run: pip install -e ".[dev]"

    # 黄金路径：wheel 安装后 import + CLI doctor + python -m 冒烟
    - name: Build wheel
      run: pip wheel . -w dist/ --no-deps

    - name: Wheel smoke in clean dir
      run: |
        python -m venv /tmp/smoke-venv
        /tmp/smoke-venv/bin/pip install -q dist/*.whl
        /tmp/smoke-venv/bin/pip install -q fastapi uvicorn
        cd /tmp && mkdir -p smoke && cd smoke
        /tmp/smoke-venv/bin/python -c "from agent_os_kernel import AgentOSKernel; k = AgentOSKernel(); pid = k.spawn_agent(name='Smoke', task='t'); cid = k.create_checkpoint(pid); assert cid and k.restore_checkpoint(cid); print('kernel golden path OK')"
        /tmp/smoke-venv/bin/agent-os-kernel doctor
        /tmp/smoke-venv/bin/python -m agent_os_kernel --help

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 文档链接检查（替代不存在 conf.py 的 sphinx-build）
    - name: Docs link check
      run: python scripts/check_docs_links.py

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: agent-os-kernel:latest

    - name: Test Docker
      run: docker run --rm agent-os-kernel:latest
