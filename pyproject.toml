[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os-kernel"
version = "0.2.0"
description = "AI Agent Operating System Kernel - 填补 Agent 生态中'缺失的内核'"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "bit-cook", email = "contact@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    # 以下为核心 import 链上的依赖（曾因缺失导致干净环境 import 即崩：
    # wheel smoke / Docker 均复现）。保持体积小的纯 Python 包。
    "watchdog>=4.0.0",      # core.config_hot_reload 配置热重载
    "jsonschema>=4.0.0",    # core.config_hot_reload 配置 schema 校验
    "structlog>=23.0.0",    # tools.mcp.client 结构化日志
    "croniter>=2.0.0",      # core.task_scheduler cron 表达式
    "httpx>=0.27.0",        # LLM providers 传输层
]

[project.optional-dependencies]
# 质量门禁：CI 唯一安装来源（原 dev extra 缺 black/mypy/ruff 导致 CI exit 127）
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
# API 服务器
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
# 文档检查
docs = [
    "linkify-it-py>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/bit-cook/Agent-OS-Kernel"
Repository = "https://github.com/bit-cook/Agent-OS-Kernel"
Issues = "https://github.com/bit-cook/Agent-OS-Kernel/issues"

[project.scripts]
agent-os-kernel = "agent_os_kernel.cli.main:main"

[tool.setuptools.packages.find]
include = ["agent_os_kernel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# 单测试 60s 超时：防止锁死锁类缺陷让套件无限挂起
timeout = 60
timeout_method = "thread"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 聚焦真 bug 类规则（CI 门禁）：pyflakes 全家桶（未定义名/未用导入/
# 重复定义/无用变量）+ 裸 except。不选 UP0xx 等现代化风格规则——
# 存量代码 3000+ 处风格问题属于 P1-05 命名空间收敛专项，不塞门禁。
select = ["F", "E722", "E7", "E9"]
ignore = ["E741", "E743"]

[tool.ruff.lint.per-file-ignores]
# P1-05（审查报告）：core/__init__.py 从 base/enhanced/advanced 多套平行
# 实现重复导入同名符号，后者静默覆盖前者。收敛为单一命名空间是多周级
# 重构（见 site/audit/report.md），完成前按文件豁免 F811。
"agent_os_kernel/core/__init__.py" = ["F811"]
# llm 包中 List['ChatMessage' 等引号前向引用（typing 合法，运行时不
# 求值），ruff 静态解析报 F821 误报。
"agent_os_kernel/llm/*.py" = ["F821"]
# 测试中的无用变量多为演示/可读性赋值（如 owner3 = ...），非缺陷。
"tests/*" = ["F841"]
# ToolResult 的 error 字段与 error() 工厂类方法同名：实例属性遮蔽类属性，
# 两者均可正常工作（dataclass 生成的 __init__ 写实例属性）。
"agent_os_kernel/tools/base.py" = ["F811"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# 分阶段 ratchet：先修核心模块，再逐步收紧
[[tool.mypy.overrides]]
module = "agent_os_kernel.kernel"
disallow_untyped_defs = false
